apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: 211425018449.dkr.ecr.ap-south-2.amazonaws.com/nginx-app:latest
        ports:
        - containerPort: 80
